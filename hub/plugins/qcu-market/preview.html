<!doctype html><html lang="zh-CN" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU市场 · 隔离预览</title>
<style>
:root{color-scheme:light;--dsw-alias-label-primary:#25302c;--dsw-alias-label-secondary:#65716a;--dsw-alias-bg-base:#fafbf8;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#edf0eb;--dsw-alias-border-l2:#e0e5dd;--dsw-alias-border-l3:#cbd4ca;--dsw-alias-brand-text:#38664e;--dsw-alias-brand-primary:#38664e;--dsw-alias-button-ghost-active-fill:#e8f1e8;--dsw-alias-button-primary-fill:#38664e;--dsw-alias-button-primary-hover:#294c39;--dsw-alias-label-primary-foreground:#fff;--dsw-alias-interactive-bg-hover:#eef2ec}
:root[data-theme=dark]{color-scheme:dark;--dsw-alias-label-primary:#e4eae4;--dsw-alias-label-secondary:#a8b5ab;--dsw-alias-bg-base:#171d1a;--dsw-alias-bg-layer-1:#202923;--dsw-alias-bg-layer-2:#2b352e;--dsw-alias-border-l2:#354139;--dsw-alias-border-l3:#4b5c50;--dsw-alias-brand-text:#a3d5ae;--dsw-alias-brand-primary:#a3d5ae;--dsw-alias-button-ghost-active-fill:#2b4434;--dsw-alias-button-primary-fill:#aad5b3;--dsw-alias-button-primary-hover:#c1e8c8;--dsw-alias-label-primary-foreground:#18291d;--dsw-alias-interactive-bg-hover:#303d34}
body{margin:0;font:14px system-ui,sans-serif;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}.preview-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 24px;border-bottom:1px solid var(--dsw-alias-border-l2);font-size:12px;color:var(--dsw-alias-label-secondary)}.preview-bar button{font:inherit;color:inherit;border:1px solid var(--dsw-alias-border-l3);background:transparent;border-radius:6px;padding:5px 10px;cursor:pointer}#panel{height:calc(100dvh - 57px)}
</style><header class="preview-bar"><span>隔离预览 · 安装状态为模拟数据</span><button id="open">打开市场</button><button id="theme">切换明暗</button><span id="preview-status" role="status"></span></header><main id="panel"></main><script src="app.js"></script></html>
