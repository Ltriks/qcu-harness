<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU Hub · 本机投稿审核</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div class="brand">QCU Hub <span>本机投稿审核</span></div><div class="theme"><label for="theme">外观</label><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div></header>
<main>
<div class="boundary">本机准备环境 · 候选不等于已发布，现有市场不会自动接纳新产品。</div>
<section id="access"><h1>角色访问</h1><p>使用本机凭据文件中的角色令牌。两个本地角色不代表组织账号或两个真实用户。</p><form id="login"><label for="token">角色令牌</label><div class="inline"><input id="token" type="password" autocomplete="off" required maxlength="200"><button>进入工作区</button></div></form></section>
<div id="workspace" hidden>
<div class="toolbar"><nav aria-label="工作区"><button id="submit-tab">投稿</button><button id="review-tab">审核</button></nav><span id="role"></span><button id="logout" class="quiet">退出</button></div>
<section id="upload-panel" hidden><h1>提交开发者材料</h1><p>选择完整 handoff 文件夹，包含 submission.json、TGZ 和全部证据。原文件夹不会被修改。</p><label for="folder">开发者 handoff 文件夹</label><input id="folder" type="file" webkitdirectory multiple><p id="selection">尚未选择文件夹</p><p class="muted">最多64个文件；单个1 MiB，JSON 256 KiB；总计10 MiB。只进行静态检查，始终需要人工审核。</p><button id="upload" disabled>上传并检查</button></section>
<div class="workspace-grid"><section class="queue"><div class="section-title"><h2 id="queue-title">投稿记录</h2><button id="refresh" class="quiet">刷新</button></div><div id="queue"></div></section><section id="detail" aria-label="投稿详情"><p class="muted">选择一条投稿查看材料、状态和下一步。</p></section></div>
</div>
<p id="message" role="status" aria-live="polite"></p>
</main>
<footer>材料留在本机私有状态目录。未执行投稿代码、安装、启用或 Hub 发布。</footer>
</body></html>
