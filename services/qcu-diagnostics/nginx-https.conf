user qcu-diagnostics;
worker_processes 1;
pid /run/qcu-diagnostics-nginx.pid;
error_log /var/log/qcu-diagnostics/error.log warn;
events { worker_connections 128; }
http {
 lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
 lua_package_cpath "/www/server/nginx/lib/lua/?.so;;";
 access_log off;
 server_tokens off;
 client_max_body_size 16k;
 client_body_timeout 5s;
 send_timeout 5s;
 limit_req_zone $binary_remote_addr zone=qcu_reports:1m rate=1r/s;
 limit_conn_zone $binary_remote_addr zone=qcu_connections:1m;
 server {
  listen 80;
  server_name 111.229.103.201;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/qcu-diagnostics/acme; default_type text/plain; }
  location = /health { proxy_pass http://127.0.0.1:18768; }
  location / { return 404; }
 }
 server {
  listen 443 ssl;
  server_name 111.229.103.201;
  ssl_certificate /etc/letsencrypt/live/111.229.103.201/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/111.229.103.201/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  location = /health { proxy_pass http://127.0.0.1:18768; }
  location = /v1/incidents {
   limit_req zone=qcu_reports burst=10 nodelay;
   limit_conn qcu_connections 4;
   proxy_pass http://127.0.0.1:18768;
   proxy_read_timeout 5s;
  }
  location ~ "^/v1/incidents/[a-f0-9-]{36}/receipt$" {
   limit_req zone=qcu_reports burst=10 nodelay;
   proxy_pass http://127.0.0.1:18768;
   proxy_read_timeout 5s;
  }
  location = /maintainer {
   auth_basic "QCU maintenance";
   auth_basic_user_file /etc/qcu-diagnostics/maintainer.htpasswd;
   proxy_pass http://127.0.0.1:18768;
  }
  location /maintainer/ {
   auth_basic "QCU maintenance";
   auth_basic_user_file /etc/qcu-diagnostics/maintainer.htpasswd;
   proxy_pass http://127.0.0.1:18768;
  }
  location /v1/maintainer/ {
   auth_basic "QCU maintenance";
   auth_basic_user_file /etc/qcu-diagnostics/maintainer.htpasswd;
   proxy_pass http://127.0.0.1:18768;
  }
  location / { return 404; }
 }
}
