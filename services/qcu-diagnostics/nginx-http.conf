user qcu-diagnostics;
worker_processes 1;
pid /run/qcu-diagnostics-nginx.pid;
error_log /var/log/qcu-diagnostics/error.log warn;
events { worker_connections 128; }
http {
 lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
 lua_package_cpath "/www/server/nginx/lib/lua/?.so;;";
 access_log off;
 server_tokens off;
 client_max_body_size 16k;
 client_body_timeout 5s;
 send_timeout 5s;
 limit_req_zone $binary_remote_addr zone=qcu_reports:1m rate=1r/s;
 limit_conn_zone $binary_remote_addr zone=qcu_connections:1m;
 server {
  listen 80;
  server_name 111.229.103.201;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/qcu-diagnostics/acme; default_type text/plain; }
  location = /health { proxy_pass http://127.0.0.1:18768; }
  location / { return 404; }
 }
}
